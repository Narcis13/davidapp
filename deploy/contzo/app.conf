# deploy/contzo/app.conf: how deploy.sh ships Fablecut to the WSL host.
# Sourced by bash, so it is shell syntax: no spaces around '=', quote values.
# Committed to git; never put secrets here (they belong in ~/apps/fablecut/shared/.env).

APP_NAME="fablecut"               # ~/apps/fablecut, unit name, Caddy site file name
SUBDOMAIN="fablecut"              # -> https://fablecut.contzo.lol
KIND="service"

# ---- service ---------------------------------------------------------------
PORT=7712                         # the studio binds 127.0.0.1:$PORT (src/server/index.js reads PORT and HOST)
HEALTH_PATH="/"                   # 200 without auth: the sign-in page while STUDIO_TOKEN is set
# The web server also runs the render queue and serves the MCP tools at /mcp (Streamable HTTP).
PROCESSES=(
  "web|node src/server/index.js"
)
SSE=1                             # /api/events is server-sent events; /mcp answers can stream too
MAX_BODY=""                       # no cap in Caddy: footage uploads go up to 2 GiB (src/server/routes/footage.js)
# data/: studio.db, renders, thumbs, uploaded files. output/: share exports (src/studio/share.js).
# Both are reached through ROOT (the release dir), where they are symlinks into shared/.
SHARED_DIRS=("data" "output")

BACKUP="sqlite:data/studio.db"    # nightly online backup of the library; data/files and renders are not backed up
# dev-only folders: browser profiles from recordings, clip working notes, prompts, the voice model cache
SYNC_EXCLUDES=("/cdp-*/" "/work/" "/goal-loop/" "/prompts/" "/tools/voice/cache/" "*.log")

# ---- hooks ---------------------------------------------------------------------
# The default app_build (npm ci; no build script) is right. No node_prune: the vendored
# fonts come from @fontsource devDependencies (npm run fonts).
app_env() {           # extra lines for the FIRST shared/.env (never rewritten later)
  echo "STUDIO_TOKEN=$(openssl rand -hex 32)"
  echo "STUDIO_HOSTS=fablecut.contzo.lol"
  echo "STUDIO_AUTHOR=studio-user"
}
